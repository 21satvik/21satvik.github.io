<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Satvik Kumar</title>
    <meta name="description" content="Satvik Kumar — Business analytics, strategy and data science. MSc candidate at UCD. Open to opportunities in Dublin." />
    <link rel="canonical" href="https://21satvik.github.io/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Slack, iMessage previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://21satvik.github.io/" />
    <meta property="og:title"       content="Satvik Kumar — Data Analytics & Strategy" />
    <meta property="og:description" content="I turn data into decisions. MSc Business Analytics at UCD. Open to roles in analytics, strategy and data science." />
    <meta property="og:image"       content="https://21satvik.github.io/images/profile.png" />
    <meta property="og:image:width"  content="460" />
    <meta property="og:image:height" content="460" />
    <meta property="og:site_name"   content="Satvik Kumar" />
    <meta property="og:locale"      content="en_IE" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Satvik Kumar — Data Analytics & Strategy" />
    <meta name="twitter:description" content="I turn data into decisions. MSc Business Analytics at UCD." />
    <meta name="twitter:image"       content="https://21satvik.github.io/images/profile.png" />

    <!-- Favicon — PNG from GitHub avatar (works everywhere including iOS) -->
    <link rel="icon" type="image/png" href="/images/profile.png" />
    <!-- Fallback SVG for modern browsers -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0c'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='16' font-style='italic' fill='%23a78bfa'>S</text></svg>" />
    <!-- Apple touch icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/profile.png" />

    <!-- GitHub Pages SPA redirect: restore path from sessionStorage -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
